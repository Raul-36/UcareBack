version: '3.9'

services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_DB: ucare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: UcareBackApp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__psqlDb: Server=db;Port=5432;Database=ucare_db;User Id=postgres;Password=postgres;
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  db_data:
